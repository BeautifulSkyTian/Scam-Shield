<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scam Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 4.5 5v5.4c0 5 3.2 9.6 7.5 11.1 4.3-1.5 7.5-6.1 7.5-11.1V5L12 2Zm0 3.1 4.7 1.9v3.4c0 3.4-1.9 6.8-4.7 8.1-2.8-1.3-4.7-4.7-4.7-8.1V7L12 5.1Z" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Scam Shield</strong>
          <small>Your message guard</small>
        </span>
        <span class="status" title="Extension active"></span>
      </header>

      <section>
        <span class="eyebrow">PROTECTION READY</span>
        <h1>Check before you click.</h1>
        <p>Open the analyzer to inspect a suspicious message and understand its warning signs.</p>

        <button id="open-analyzer" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 4.5 5v5.4c0 5 3.2 9.6 7.5 11.1 4.3-1.5 7.5-6.1 7.5-11.1V5L12 2Zm0 3.1 4.7 1.9v3.4c0 3.4-1.9 6.8-4.7 8.1-2.8-1.3-4.7-4.7-4.7-8.1V7L12 5.1Z" />
          </svg>
          Open analyzer
        </button>

        <p class="error" id="popup-error" role="alert" hidden></p>
      </section>

      <footer>Never share passwords or verification codes.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
