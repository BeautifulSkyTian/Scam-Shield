<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scam Shield</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 4.5 5v5.4c0 5 3.2 9.6 7.5 11.1 4.3-1.5 7.5-6.1 7.5-11.1V5L12 2Zm0 3.1 4.7 1.9v3.4c0 3.4-1.9 6.8-4.7 8.1-2.8-1.3-4.7-4.7-4.7-8.1V7L12 5.1Z" />
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Scam Shield</strong>
          <small>Basic mode</small>
        </span>
        <span class="status" title="Extension active"></span>
      </header>

      <nav class="popup-mode-switch" aria-label="Analysis mode">
        <span class="active-mode" aria-current="page">Basic</span>
        <button id="advanced-mode-tab" type="button">Advanced</button>
      </nav>

      <section class="loading-state" id="loading-state">
        <span class="spinner"></span>
        <p>Reading highlighted text...</p>
      </section>

      <section class="empty-state" id="empty-state" hidden>
        <span class="selection-icon">Aa</span>
        <h1 id="empty-heading">Highlight a message</h1>
        <p id="empty-message">Select suspicious text on the page, then reopen Scam Shield for a quick check.</p>
      </section>

      <section class="selection-state" id="selection-state" hidden>
        <span class="eyebrow">HIGHLIGHTED MESSAGE</span>
        <blockquote id="selection-preview"></blockquote>
        <button class="primary-button" id="analyze-selection" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2 4.5 5v5.4c0 5 3.2 9.6 7.5 11.1 4.3-1.5 7.5-6.1 7.5-11.1V5L12 2Zm0 3.1 4.7 1.9v3.4c0 3.4-1.9 6.8-4.7 8.1-2.8-1.3-4.7-4.7-4.7-8.1V7L12 5.1Z" />
          </svg>
          Check highlighted text
        </button>
      </section>

      <section class="result-state" id="result-state" hidden>
        <div class="quick-result">
          <span class="quick-score" id="quick-score">0</span>
          <div>
            <span class="risk-label" id="risk-label"></span>
            <strong id="result-category"></strong>
          </div>
        </div>
        <h1 id="result-headline"></h1>
        <p id="result-action"></p>
        <button class="primary-button" id="view-details" type="button">View advanced details</button>
      </section>

      <p class="error" id="popup-error" role="alert" hidden></p>

      <footer>
        <button class="advanced-button" id="open-advanced" type="button">Open full analyzer <span aria-hidden="true">&#8594;</span></button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
